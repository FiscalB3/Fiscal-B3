services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fiscal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: fiscal_b3
    ports:
      - "5432:5432"
    volumes:
      - fiscal_b3_pg:/var/lib/postgresql/data

volumes:
  fiscal_b3_pg:
